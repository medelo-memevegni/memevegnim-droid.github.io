<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medelo Memevegni | Statistique & Data</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            line-height: 1.6;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #123c69;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 22px;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
        }

        nav a:hover {
            color: #123c69;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
        }

        .hero-content {
            max-width: 1200px;
            margin: auto;
            padding: 80px 25px;
        }

        .hero h1 {
            font-size: 55px;
            max-width: 800px;
            color: #102a43;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #1769aa;
        }

        .hero p {
            max-width: 700px;
            font-size: 19px;
            color: #52606d;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background: #1769aa;
            color: white;
        }

        .btn-secondary {
            border: 1px solid #1769aa;
            color: #1769aa;
            background: white;
        }

        section {
            max-width: 1200px;
            margin: auto;
            padding: 80px 25px;
        }

        .section-title {
            font-size: 34px;
            margin-bottom: 15px;
            color: #102a43;
        }

        .section-description {
            max-width: 700px;
            color: #627d98;
            margin-bottom: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #123c69;
        }

        .card p {
            color: #627d98;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background: white;
            border: 1px solid #d9e2ec;
            padding: 10px 15px;
            border-radius: 20px;
        }

        footer {
            background: #102a43;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        footer p {
            opacity: 0.8;
        }

        @media (max-width: 800px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 38px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>
